plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Loom 1.18.2 requires JDK 25 to run; bytecode remains Java 21 compatible.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/mystResources'))

tasks.register('generateMystTextures') {
    outputs.dir(layout.buildDirectory.dir('generated/mystResources'))
    doLast {
        def root = layout.buildDirectory.dir('generated/mystResources').get().asFile
        def target = new File(root, 'assets/mystclient/textures/gui/myst_background.png')
        target.parentFile.mkdirs()
        // Smooth procedural gradient: visually rich but highly PNG-compressible.
        int size = 1024
        def image = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_RGB)
        for (int yy = 0; yy < size; yy++) {
            double ny = (yy - size * 0.5d) / size
            for (int xx = 0; xx < size; xx++) {
                double nx = (xx - size * 0.5d) / size
                double radius = Math.sqrt(nx * nx * 1.8d + ny * ny * 1.8d)
                double glow = Math.max(0d, 1d - radius * 2.1d)
                double wave = (Math.sin((xx + yy * 0.72d) * 0.012d) + 1d) * 0.5d
                double vignette = Math.max(0.48d, 1d - radius * 0.9d)
                int r = (int)Math.max(5d, Math.min(255d, (12d + glow * 45d + wave * 12d) * vignette))
                int g = (int)Math.max(4d, Math.min(255d, (8d + glow * 23d + wave * 8d) * vignette))
                int b = (int)Math.max(12d, Math.min(255d, (24d + glow * 82d + wave * 25d) * vignette))
                image.setRGB(xx, yy, (r << 16) | (g << 8) | b)
            }
        }
        javax.imageio.ImageIO.write(image, 'png', target)
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateMystTextures')
}
