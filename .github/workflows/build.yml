name: Build Myst Visuals
permissions:
  contents: write
concurrency:
  group: myst-visuals-${{ github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'
          cache-read-only: false
      - name: Build mod
        run: gradle build --build-cache --parallel --no-daemon
      - name: Verify JAR contents
        run: |
          JAR="build/libs/Myst-Visuals-0.5.2.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'fabric.mod.json'
          jar tf "$JAR" | grep -q 'dev/myst/client/WaypointScreen.class'
          jar tf "$JAR" | grep -q 'assets/mystclient/icon.png'
          jar tf "$JAR" | grep -q 'assets/mystclient/textures/gui/myst_background.png'
          unzip -t "$JAR"
          echo "JAR size: $(du -h "$JAR" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: Myst-Visuals-1.21.11
          path: build/libs/Myst-Visuals-0.5.2.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish direct JAR download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.5.2"
          TAG="v${VERSION}"
          JAR="build/libs/Myst-Visuals-${VERSION}.jar"
          NOTES="Myst Visuals ${VERSION} for Minecraft Java 1.21.11. Fabric client-side visual mod. Built and archive-verified by GitHub Actions."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --title "Myst Visuals ${VERSION}" --notes "$NOTES"
          fi
