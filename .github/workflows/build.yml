name: Build Mist Visuals
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'
      - name: Build mod
        run: gradle build
      - name: Verify JAR contents
        run: |
          test -f build/libs/Mist-Visuals-0.3.0.jar
          jar tf build/libs/Mist-Visuals-0.2.0.jar | grep -q 'fabric.mod.json'
          jar tf build/libs/Mist-Visuals-0.2.0.jar | grep -q 'assets/mystclient/icon.png'
      - uses: actions/upload-artifact@v4
        with:
          name: Mist-Visuals-1.21.11
          path: build/libs/Mist-Visuals-0.2.0.jar
          if-no-files-found: error
