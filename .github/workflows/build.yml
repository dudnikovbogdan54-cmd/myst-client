name: Build Myst Visuals

permissions:
  contents: write

concurrency:
  group: myst-visuals-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # Loom 1.18.2 requires JDK 25 to run. build.gradle still compiles
      # the mod with --release 21, so the resulting classes target Java 21.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'
          cache-read-only: false

      - name: Generate and commit Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.7.1 --distribution-type bin
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "Add Gradle 9.7.1 wrapper"
            git push
          fi

      - name: Build mod
        run: ./gradlew build --build-cache --parallel --no-daemon

      - name: Verify JAR contents
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Myst-Visuals-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)"
          test -n "$JAR"
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'fabric.mod.json'
          jar tf "$JAR" | grep -q 'dev/myst/client/ClickGuiScreen.class'
          jar tf "$JAR" | grep -q 'dev/myst/client/HudManager.class'
          jar tf "$JAR" | grep -q 'dev/myst/client/HudEditorScreen.class'
          jar tf "$JAR" | grep -q 'dev/myst/client/ConfigManager.class'
          jar tf "$JAR" | grep -q 'dev/myst/client/module/ModuleManager.class'
          jar tf "$JAR" | grep -q 'dev/myst/client/module/marks/Waypoints.class'
          jar tf "$JAR" | grep -q 'dev/myst/client/CustomCrosshair.class'
          jar tf "$JAR" | grep -q 'assets/mystclient/icon.png'
          unzip -t "$JAR"
          echo "Verified: $JAR"
          echo "JAR size: $(du -h "$JAR" | cut -f1)"
          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Myst-Visuals-1.21.11
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
